services:

    _defaults:
        autowire: false
        autoconfigure: false

    # -------------------------------------------------------------------------
    # SSR Gateway: NullSsrGateway by default (SSR disabled).
    # InertiaBundle::loadExtension() overrides this with HttpSsrGateway when
    # ssr_enabled: true, injecting the configured ssrUrl.
    # -------------------------------------------------------------------------
    inertia.ssr_gateway:
        class: Nytodev\InertiaBundle\Ssr\NullSsrGateway
        public: false

    # -------------------------------------------------------------------------
    # Response builder: constructs the Inertia page object and returns
    # either an HTML response (first visit) or a JSON response (XHR visit).
    # -------------------------------------------------------------------------
    inertia.response:
        class: Nytodev\InertiaBundle\Response\InertiaResponse
        public: false
        arguments:
            $twig: '@twig'

    # -------------------------------------------------------------------------
    # Core service: manages shared props and delegates to InertiaResponse.
    # Note: $rootView and $version are injected at compile time via
    # InertiaBundle::loadExtension() from the validated config.
    # -------------------------------------------------------------------------
    inertia.service:
        class: Nytodev\InertiaBundle\Service\Inertia
        public: false
        arguments:
            $requestStack: '@request_stack'
            $inertiaResponse: '@inertia.response'
        tags:
            - { name: kernel.reset, method: reset }

    # -------------------------------------------------------------------------
    # Event listener: kernel.request (version check → 409) +
    #                 kernel.response (302 → 303 conversion + once-prop flush)
    # -------------------------------------------------------------------------
    inertia.listener:
        class: Nytodev\InertiaBundle\EventListener\InertiaListener
        public: false
        arguments:
            $inertia: '@inertia.service'
        tags:
            - { name: kernel.event_listener, event: kernel.request, method: onKernelRequest, priority: 20 }
            - { name: kernel.event_listener, event: kernel.response, method: onKernelResponse, priority: 0 }

    # -------------------------------------------------------------------------
    # Twig extension: inertia(page) and inertiaHead(page) template functions.
    # Dispatches the SSR gateway once per request; reset() clears the cache
    # between requests in FrankenPHP/ReactPHP persistent workers.
    # -------------------------------------------------------------------------
    inertia.twig_extension:
        class: Nytodev\InertiaBundle\Twig\InertiaTwigExtension
        public: false
        arguments:
            $ssrGateway: '@inertia.ssr_gateway'
        tags:
            - { name: twig.extension }
            - { name: kernel.reset, method: reset }

    # -------------------------------------------------------------------------
    # Console commands: SSR server management.
    # Arguments are injected at compile time via InertiaBundle::loadExtension().
    # -------------------------------------------------------------------------
    inertia.command.start_ssr:
        class: Nytodev\InertiaBundle\Command\StartSsrCommand
        public: false
        tags:
            - { name: console.command }

    inertia.command.stop_ssr:
        class: Nytodev\InertiaBundle\Command\StopSsrCommand
        public: false
        tags:
            - { name: console.command }

    inertia.command.check_ssr:
        class: Nytodev\InertiaBundle\Command\CheckSsrCommand
        public: false
        tags:
            - { name: console.command }

    # =========================================================================
    # Public aliases for autowiring — inject the FQCN type-hint in controllers
    # =========================================================================
    Nytodev\InertiaBundle\Service\Inertia:
        alias: inertia.service
        public: true
