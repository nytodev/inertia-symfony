services:

    _defaults:
        autowire: false
        autoconfigure: false

    # -------------------------------------------------------------------------
    # Response builder: constructs the Inertia page object and returns
    # either an HTML response (first visit) or a JSON response (XHR visit).
    # -------------------------------------------------------------------------
    inertia.response:
        class: Nytodev\InertiaBundle\Response\InertiaResponse
        public: false
        arguments:
            $twig: '@twig'

    # -------------------------------------------------------------------------
    # Core service: manages shared props and delegates to InertiaResponse.
    # -------------------------------------------------------------------------
    inertia.service:
        class: Nytodev\InertiaBundle\Service\Inertia
        public: false
        arguments:
            $requestStack: '@request_stack'
            $twig: '@twig'
            $inertiaResponse: '@inertia.response'
        tags:
            - { name: kernel.reset, method: reset }

    # -------------------------------------------------------------------------
    # Event listener: kernel.request (version check → 409) +
    #                 kernel.response (302 → 303 conversion + once-prop flush)
    # -------------------------------------------------------------------------
    inertia.listener:
        class: Nytodev\InertiaBundle\EventListener\InertiaListener
        public: false
        arguments:
            $inertia: '@inertia.service'
        tags:
            - { name: kernel.event_listener, event: kernel.request, method: onKernelRequest, priority: 20 }
            - { name: kernel.event_listener, event: kernel.response, method: onKernelResponse, priority: 0 }

    # -------------------------------------------------------------------------
    # Twig extension: inertia(page) and inertiaHead(page) template functions
    # -------------------------------------------------------------------------
    inertia.twig_extension:
        class: Nytodev\InertiaBundle\Twig\InertiaTwigExtension
        public: false
        tags:
            - { name: twig.extension }

    # =========================================================================
    # Public aliases for autowiring — inject the FQCN type-hint in controllers
    # =========================================================================
    Nytodev\InertiaBundle\Service\Inertia:
        alias: inertia.service
        public: true
